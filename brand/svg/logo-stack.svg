<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 后两层卡(不同明度,营造堆叠) -->
  <rect x="150" y="60" width="256" height="392" rx="48" fill="#1e3a8a" opacity="0.45"/>
  <rect x="112" y="94" width="320" height="392" rx="52" fill="#2563eb" opacity="0.7"/>
  <!-- 前卡(accent 渐变) -->
  <rect x="72" y="128" width="384" height="392" rx="56" fill="url(#g)"/>
  <rect x="72" y="128" width="384" height="392" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>
  <!-- 前卡上的内容条(隐喻 skill 卡片) -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="128" y="204" width="160" height="26" rx="13"/>
    <rect x="128" y="258" width="120" height="26" rx="13" opacity="0.7"/>
  </g>
  <!-- 底部枢纽节点 -->
  <circle cx="256" cy="376" r="34" fill="#ffffff"/>
  <circle cx="256" cy="376" r="13" fill="#1d4ed8"/>
</svg>
